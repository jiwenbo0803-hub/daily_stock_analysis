name: 美股大盘复盘（早间）

on:
  schedule:
    - cron: '13 0 * * 1-5'   # UTC 00:13 = 北京时间 08:13，周一到周五
  workflow_dispatch:         # 允许手动触发测试

concurrency:
  group: us-market-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行美股个股分析 + 大盘复盘
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          STOCK_LIST: ${{ vars.STOCK_LIST_US || secrets.STOCK_LIST_US }}
          MARKET_REVIEW_REGION: 'us'
          MARKET_REVIEW_ENABLED: 'true'
          TRADING_DAY_CHECK_ENABLED: 'false'
          REPORT_TYPE: 'simple'
        run: |
          if [ -z "${STOCK_LIST:-}" ]; then
            echo "未配置 STOCK_LIST_US，仅执行大盘复盘"
            python main.py --market-review
          else
            echo "美股自选股: $STOCK_LIST"
            python main.py
          fi
